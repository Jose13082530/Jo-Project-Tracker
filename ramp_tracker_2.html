<div id="app"></div>

<style>
  #app {
    --ink: #172033;
    --muted: #5B6472;
    --faint: #8B93A3;
    --bg: #F1F3F6;
    --surface: #FFFFFF;
    --border: #DCE1E8;
    --not-started: #9AA3B2;
    --in-progress: #0E7C86;
    --blocked: #C2760C;
    --done: #1E8F5F;
    --calls: #5A54D6;
    --not-started-bg: #EEF0F3;
    --in-progress-bg: #E3F1F1;
    --blocked-bg: #FBEDDC;
    --done-bg: #E4F3EA;
    --calls-bg: #EBEAFB;

    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 28px 20px 60px;
    min-height: 100vh;
    box-sizing: border-box;
  }
  #app * { box-sizing: border-box; }
  #app h1, #app h2, #app h3 { font-family: 'Space Grotesk', 'Inter', sans-serif; margin: 0; }

  .wrap { max-width: 780px; margin: 0 auto; }

  .header { margin-bottom: 22px; }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--faint); font-weight: 600; margin-bottom: 6px;
  }
  .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .header p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

  .dash {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 24px;
  }
  .dash-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .dash-top .pct {
    font-size: 32px; font-weight: 700; font-family: 'Space Grotesk', sans-serif;
  }
  .dash-top .pct-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .overall-track {
    height: 10px; border-radius: 999px; background: var(--not-started-bg);
    overflow: hidden; display: flex; margin-bottom: 18px;
  }
  .overall-track > div { height: 100%; }
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat {
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    text-align: left;
  }
  .stat .num { font-size: 19px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
  .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .stat.ns .num { color: var(--not-started); }
  .stat.ip .num { color: var(--in-progress); }
  .stat.bl .num { color: var(--blocked); }
  .stat.dn .num { color: var(--done); }

  .dash-divider { border: none; border-top: 1px solid var(--border); margin: 18px 0 16px; }
  .dash-section-label {
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--faint); font-weight: 700; margin-bottom: 10px;
  }
  .category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .category-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .category-card .cat-label {
    font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .category-card .cat-value {
    font-size: 18px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; margin-bottom: 8px;
  }
  .category-card .cat-track { height: 6px; border-radius: 999px; background: var(--not-started-bg); overflow: hidden; }
  .category-card .cat-track > div { height: 100%; border-radius: 999px; }

  .project {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 20px; margin-bottom: 16px;
  }
  .project-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
  .project-title-row { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .project h3 { font-size: 16px; font-weight: 700; }
  .project-title-input {
    font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700;
    border: none; background: transparent; color: var(--ink); width: 100%; padding: 2px 0;
  }
  .project-title-input:focus { outline: none; border-bottom: 1px solid var(--border); }
  .project-meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chevron { color: var(--faint); font-size: 12px; transition: transform 0.15s ease; flex-shrink: 0; }
  .chevron.open { transform: rotate(90deg); }

  .runway { display: flex; gap: 3px; margin-top: 12px; height: 8px; }
  .runway .seg { flex: 1; border-radius: 4px; }
  .runway .seg.not-started { background: var(--not-started-bg); }
  .runway .seg.in-progress { background: var(--in-progress); }
  .runway .seg.blocked { background: var(--blocked); }
  .runway .seg.done { background: var(--done); }

  .tasks { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .task-block { border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
  .task { display: flex; align-items: center; gap: 8px; padding: 8px 10px; flex-wrap: wrap; }
  .task-name { flex: 1; font-size: 14px; border: none; background: transparent; color: var(--ink); min-width: 90px; }
  .task-name:focus { outline: none; }
  .task-due {
    font-size: 12px; border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 6px; color: var(--muted); background: var(--bg); width: 128px; flex-shrink: 0;
  }
  .task-due:focus { outline: none; border-color: var(--in-progress); }
  .status-pill {
    font-size: 11px; font-weight: 600; border-radius: 999px; padding: 5px 10px;
    border: none; cursor: pointer; white-space: nowrap; font-family: 'Inter', sans-serif; flex-shrink: 0;
  }
  .status-pill.not-started { background: var(--not-started-bg); color: var(--not-started); }
  .status-pill.in-progress { background: var(--in-progress-bg); color: var(--in-progress); }
  .status-pill.blocked { background: var(--blocked-bg); color: var(--blocked); }
  .status-pill.done { background: var(--done-bg); color: var(--done); }

  .icon-btn {
    border: none; background: transparent; color: var(--faint); cursor: pointer;
    font-size: 14px; padding: 4px 6px; border-radius: 6px; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--not-started-bg); color: var(--muted); }
  .icon-btn.has-note { color: var(--in-progress); }

  .task-notes {
    width: 100%; border: none; border-top: 1px solid var(--border);
    background: var(--bg); font-family: 'Inter', sans-serif; font-size: 13px;
    color: var(--ink); padding: 8px 10px; resize: vertical; min-height: 50px;
  }
  .task-notes:focus { outline: none; }
  .task-notes::placeholder { color: var(--faint); }

  .add-task-btn {
    font-size: 13px; color: var(--in-progress); background: transparent; border: none;
    cursor: pointer; padding: 4px 2px; text-align: left; font-weight: 600; margin-top: 2px;
  }

  .add-project-btn {
    width: 100%; padding: 14px; border-radius: 14px; border: 1.5px dashed var(--border);
    background: transparent; color: var(--muted); font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: 'Inter', sans-serif;
  }
  .add-project-btn:hover { border-color: var(--in-progress); color: var(--in-progress); }

  .counter-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 20px; margin-bottom: 16px;
  }
  .counter-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .counter-title-input {
    font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700;
    border: none; background: transparent; color: var(--ink); flex: 1; min-width: 160px; padding: 2px 0;
  }
  .counter-title-input:focus { outline: none; border-bottom: 1px solid var(--border); }
  .counter-controls { display: flex; align-items: center; gap: 8px; }
  .counter-btn {
    width: 26px; height: 26px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--bg); color: var(--calls); font-size: 15px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .counter-btn:hover { background: var(--calls-bg); }
  .counter-value {
    font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700;
    width: 34px; text-align: center; border: none; background: transparent; color: var(--ink);
  }
  .counter-value:focus { outline: none; }
  .counter-target-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .counter-target-input {
    width: 34px; border: 1px solid var(--border); border-radius: 6px; text-align: center;
    font-size: 12px; padding: 3px; color: var(--ink); background: var(--bg);
  }
  .counter-track { height: 8px; border-radius: 999px; background: var(--not-started-bg); overflow: hidden; margin-top: 12px; }
  .counter-track > div { height: 100%; background: var(--calls); border-radius: 999px; }
  .counter-notes-row { margin-top: 10px; }
  .counter-notes {
    width: 100%; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); font-family: 'Inter', sans-serif; font-size: 13px;
    color: var(--ink); padding: 8px 10px; resize: vertical; min-height: 44px; margin-top: 8px;
  }
  .counter-notes:focus { outline: none; border-color: var(--calls); }
  .counter-notes::placeholder { color: var(--faint); }

  .save-note { text-align: center; font-size: 11px; color: var(--faint); margin-top: 10px; }
  .footer-row { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 18px; }
  .footer-link {
    font-size: 12px; color: var(--in-progress); background: transparent; border: none;
    cursor: pointer; font-weight: 600; font-family: 'Inter', sans-serif;
  }
  .footer-sep { color: var(--faint); font-size: 12px; }

  @media (max-width: 480px) {
    .category-grid { grid-template-columns: 1fr; }
    .task-due { width: 120px; }
  }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap">

<script>
(function() {
  const STATUSES = ['not-started', 'in-progress', 'blocked', 'done'];
  const STATUS_LABEL = { 'not-started': 'Not started', 'in-progress': 'In progress', 'blocked': 'Blocked', 'done': 'Done' };
  const STORAGE_KEY = 'ramp-tracker-state-v2';

  // Supabase config — free hosted Postgres used so this syncs across devices/browsers
  const SUPABASE_URL = 'https://sqmvuzdfzctqtwoweiju.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_bpO0awgBRbetDgtZ0CX8Pg_Gf2Hea7T';
  const SUPABASE_ROW_ID = 'main';

  async function supabaseSave(payload) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/tracker_data`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify({ id: SUPABASE_ROW_ID, payload: payload, updated_at: new Date().toISOString() })
    });
    if (!res.ok) throw new Error('Supabase save failed: ' + res.status);
    return true;
  }

  async function supabaseLoad() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/tracker_data?id=eq.${SUPABASE_ROW_ID}&select=payload`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    if (!res.ok) throw new Error('Supabase load failed: ' + res.status);
    const rows = await res.json();
    return (rows && rows[0]) ? rows[0].payload : null;
  }

  const defaultState = {
    projects: [
      { id: 'p1', title: 'Product Understanding', open: true, tasks: [
        { id: 't1', name: 'Via Demos & Website Content', status: 'done', dueDate: '2026-07-31', notes: '', notesOpen: false },
        { id: 't2', name: 'Teach Back Demo Via Demo Instance', status: 'not-started', dueDate: '2026-08-07', notes: '', notesOpen: false },
        { id: 't3', name: 'Forrester Review', status: 'in-progress', dueDate: '2026-07-31', notes: 'Key gap - proof points miss - AI application/ verticalized-workflows with proof points - identify customers - get all those before MQ - Gartner MQ re-fill in 1 more week. August to November - 3 months to build out the MQ universe. Build the demo universe (pre-recorded demos - verticalized-workflows - ai usecases - customer use-cases) Mfg/HE/Public sector - SciQuest US (HE) : JMP; = rewrite for Gartner & position for HE (students start on one day, story-telling), Bravo Solutions (Italy - Public Sector) - Spain/UK/Italy - bureaucracy - Govt cannot single-source - start with a specific use-case) - Pool for Tool (Vienna - Mfg) - German mfg. Core differentiator for us is verticalization - we cannot be everything for everyone - coupa/Ariba - we lost. Similar to Italy after UK & US in WWII - Italy repositioned to Fashion, Coffee, Tourism etc. - look at strengths & put that into our messaging - pivot to the analysts on this messaging. Second differentiator - AI - Our AI is verticalized like us - come up with specific messaging with compelling proof points - for each vertical  - quicker is Forrester (demo with Forrester) - start demo prep with PMM - rebuild', notesOpen: true }
      ]},
      { id: 'p2', title: 'Stakeholder Intros', open: true, tasks: [
        { id: 't4', name: 'PMMs', status: 'in-progress', dueDate: '2026-07-31', notes: '', notesOpen: false },
        { id: 't5', name: 'PMs', status: 'in-progress', dueDate: '2026-08-04', notes: '', notesOpen: false },
        { id: 't6', name: 'Customer Success', status: 'not-started', dueDate: '2026-08-05', notes: '', notesOpen: false },
        { id: 't7', name: 'Solution / Tech Experts', status: 'not-started', dueDate: '2026-08-05', notes: '', notesOpen: false }
      ]},
      { id: 'p3', title: 'Analyst Relations', open: true, tasks: [
        { id: 't8', name: 'Getting Started Via KT', status: 'in-progress', dueDate: '2026-08-07', notes: '', notesOpen: false },
        { id: 't9', name: 'Review Contracts', status: 'not-started', dueDate: '2026-08-07', notes: '', notesOpen: false },
        { id: 't10', name: 'Review Earlier Submissions & Feedback', status: 'in-progress', dueDate: '2026-08-07', notes: '', notesOpen: false },
        { id: 't11', name: 'Calendar', status: 'not-started', dueDate: '2026-08-07', notes: '', notesOpen: false }
      ]}
    ],
    counter: { title: 'Watch Discovery / Demo Calls', current: 0, target: 10, notes: '', notesOpen: false }
  };

  let state = null;
  let saveTimer = null;

  function uid() { return 'id' + Math.random().toString(36).slice(2, 9); }

  let saveStatus = 'idle'; // idle | saving | saved | offline

  function setSaveStatus(v) {
    saveStatus = v;
    const el = document.getElementById('saveNote');
    if (el) el.textContent = saveStatusText();
  }

  function saveStatusText() {
    if (saveStatus === 'saving') return 'Saving...';
    if (saveStatus === 'synced') return 'Synced to cloud — available on any device';
    if (saveStatus === 'offline') return 'Cloud sync unavailable right now — saved locally to this browser instead. Use Export below to back it up.';
    return 'Changes save automatically';
  }

  function localFallbackSave() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return true; }
    catch (e) { return false; }
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    setSaveStatus('saving');
    saveTimer = setTimeout(async () => {
      // 1. Try Supabase (cross-device cloud sync)
      try {
        await supabaseSave(state);
        localFallbackSave();
        setSaveStatus('synced');
        return;
      } catch (e) {
        console.error('Supabase save failed, falling back', e);
      }
      // 2. Try Claude.ai's window.storage (only exists inside Claude.ai artifact viewer)
      if (window.storage) {
        let attempts = 0, ok = false;
        while (attempts < 2 && !ok) {
          try { await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); ok = true; }
          catch (e) { attempts++; if (attempts < 2) await new Promise(r => setTimeout(r, 400)); }
        }
        if (ok) { localFallbackSave(); setSaveStatus('saved'); return; }
      }
      // 3. Last resort: browser local storage only
      localFallbackSave();
      setSaveStatus('offline');
    }, 250);
  }

  function exportState() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ramp-tracker-backup.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importState(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (parsed && parsed.projects) {
          state = parsed;
          if (!state.counter) state.counter = JSON.parse(JSON.stringify(defaultState.counter));
          scheduleSave();
          render();
        }
      } catch (err) { console.error('Import failed: invalid file', err); }
    };
    reader.readAsText(file);
  }

  function cycleStatus(current) {
    const idx = STATUSES.indexOf(current);
    return STATUSES[(idx + 1) % STATUSES.length];
  }

  function projectPct(project) {
    if (!project.tasks.length) return 0;
    const done = project.tasks.filter(t => t.status === 'done').length;
    return Math.round((done / project.tasks.length) * 100);
  }

  function computeStats() {
    let total = 0, ns = 0, ip = 0, bl = 0, dn = 0;
    state.projects.forEach(p => p.tasks.forEach(t => {
      total++;
      if (t.status === 'not-started') ns++;
      else if (t.status === 'in-progress') ip++;
      else if (t.status === 'blocked') bl++;
      else if (t.status === 'done') dn++;
    }));
    const pct = total ? Math.round((dn / total) * 100) : 0;
    return { total, ns, ip, bl, dn, pct };
  }

  function render() {
    const app = document.getElementById('app');
    const s = computeStats();
    const c = state.counter;
    const callsPct = c.target > 0 ? Math.min(100, Math.round((c.current / c.target) * 100)) : 0;

    app.innerHTML = `
      <div class="wrap">
        <div class="header">
          <div class="eyebrow">Ramp Plan &middot; Tracker</div>
          <h1>Onboarding To-Dos</h1>
          <p>Projects, broken into sub-actions, with status, due dates, and notes tracked as you go.</p>
        </div>

        <div class="dash">
          <div class="dash-top">
            <div>
              <div class="pct">${s.pct}%</div>
              <div class="pct-label">${s.dn} of ${s.total} sub-tasks done</div>
            </div>
          </div>
          <div class="overall-track">
            ${s.total ? `
              <div style="width:${s.dn/s.total*100}%; background:var(--done)"></div>
              <div style="width:${s.ip/s.total*100}%; background:var(--in-progress)"></div>
              <div style="width:${s.bl/s.total*100}%; background:var(--blocked)"></div>
            ` : ''}
          </div>
          <div class="stat-row">
            <div class="stat ns"><div class="num">${s.ns}</div><div class="lbl">Not started</div></div>
            <div class="stat ip"><div class="num">${s.ip}</div><div class="lbl">In progress</div></div>
            <div class="stat bl"><div class="num">${s.bl}</div><div class="lbl">Blocked</div></div>
            <div class="stat dn"><div class="num">${s.dn}</div><div class="lbl">Done</div></div>
          </div>

          <hr class="dash-divider" />
          <div class="dash-section-label">By category</div>
          <div class="category-grid">
            ${state.projects.map(p => `
              <div class="category-card">
                <div class="cat-label">${escapeHtml(p.title)}</div>
                <div class="cat-value">${projectPct(p)}%</div>
                <div class="cat-track"><div style="width:${projectPct(p)}%; background:var(--done)"></div></div>
              </div>
            `).join('')}
            <div class="category-card">
              <div class="cat-label">${escapeHtml(c.title)}</div>
              <div class="cat-value">${c.current}/${c.target}</div>
              <div class="cat-track"><div style="width:${callsPct}%; background:var(--calls)"></div></div>
            </div>
          </div>
        </div>

        <div id="projects"></div>
        <div id="counterCard"></div>

        <button class="add-project-btn" id="addProjectBtn">+ Add project</button>
        <div class="footer-row">
          <button class="footer-link" id="exportBtn">Export backup</button>
          <span class="footer-sep">&middot;</span>
          <label class="footer-link" for="importInput">Load backup</label>
          <input type="file" id="importInput" accept="application/json" style="display:none" />
        </div>
        <div class="save-note" id="saveNote">${saveStatusText()}</div>
      </div>
    `;

    const projectsEl = document.getElementById('projects');
    state.projects.forEach(project => { projectsEl.appendChild(renderProject(project)); });
    document.getElementById('counterCard').appendChild(renderCounterCard());

    document.getElementById('addProjectBtn').onclick = () => {
      state.projects.push({ id: uid(), title: 'New Project', open: true, tasks: [] });
      scheduleSave(); render();
    };
    document.getElementById('exportBtn').onclick = exportState;
    document.getElementById('importInput').onchange = (e) => {
      if (e.target.files && e.target.files[0]) importState(e.target.files[0]);
    };
  }

  function renderProject(project) {
    const done = project.tasks.filter(t => t.status === 'done').length;
    const wrapper = document.createElement('div');
    wrapper.className = 'project';

    const head = document.createElement('div');
    head.className = 'project-head';
    head.innerHTML = `
      <div class="project-title-row">
        <span class="chevron ${project.open ? 'open' : ''}">&#9656;</span>
        <input class="project-title-input" value="${escapeAttr(project.title)}" />
      </div>
      <div class="project-meta">${done}/${project.tasks.length}</div>
      <button class="icon-btn" title="Delete project">&#10005;</button>
    `;

    const chevron = head.querySelector('.chevron');
    const titleInput = head.querySelector('.project-title-input');
    const deleteBtn = head.querySelector('.icon-btn');

    chevron.onclick = () => { project.open = !project.open; scheduleSave(); render(); };
    titleInput.onclick = (e) => e.stopPropagation();
    titleInput.oninput = (e) => { project.title = e.target.value; scheduleSave(); };
    deleteBtn.onclick = () => {
      state.projects = state.projects.filter(p => p.id !== project.id);
      scheduleSave(); render();
    };

    wrapper.appendChild(head);

    if (project.tasks.length) {
      const runway = document.createElement('div');
      runway.className = 'runway';
      project.tasks.forEach(t => {
        const seg = document.createElement('div');
        seg.className = 'seg ' + t.status;
        runway.appendChild(seg);
      });
      wrapper.appendChild(runway);
    }

    if (project.open) {
      const tasksEl = document.createElement('div');
      tasksEl.className = 'tasks';

      project.tasks.forEach(task => {
        const block = document.createElement('div');
        block.className = 'task-block';

        const row = document.createElement('div');
        row.className = 'task';
        row.innerHTML = `
          <input class="task-name" value="${escapeAttr(task.name)}" />
          <input type="date" class="task-due" value="${escapeAttr(task.dueDate || '')}" />
          <button class="status-pill ${task.status}">${STATUS_LABEL[task.status]}</button>
          <button class="icon-btn note-toggle ${task.notes ? 'has-note' : ''}" title="Notes">&#9998;</button>
          <button class="icon-btn del" title="Delete">&#10005;</button>
        `;
        const nameInput = row.querySelector('.task-name');
        const dueInput = row.querySelector('.task-due');
        const pill = row.querySelector('.status-pill');
        const noteToggle = row.querySelector('.note-toggle');
        const delBtn = row.querySelector('.del');

        nameInput.oninput = (e) => { task.name = e.target.value; scheduleSave(); };
        dueInput.onchange = (e) => { task.dueDate = e.target.value; scheduleSave(); };
        pill.onclick = () => { task.status = cycleStatus(task.status); scheduleSave(); render(); };
        noteToggle.onclick = () => { task.notesOpen = !task.notesOpen; scheduleSave(); render(); };
        delBtn.onclick = () => {
          project.tasks = project.tasks.filter(t => t.id !== task.id);
          scheduleSave(); render();
        };

        block.appendChild(row);

        if (task.notesOpen) {
          const notesArea = document.createElement('textarea');
          notesArea.className = 'task-notes';
          notesArea.placeholder = 'Write a note, or paste a link to an attachment...';
          notesArea.value = task.notes || '';
          notesArea.oninput = (e) => { task.notes = e.target.value; scheduleSave(); };
          block.appendChild(notesArea);
        }

        tasksEl.appendChild(block);
      });

      const addTaskBtn = document.createElement('button');
      addTaskBtn.className = 'add-task-btn';
      addTaskBtn.textContent = '+ Add sub-task';
      addTaskBtn.onclick = () => {
        project.tasks.push({ id: uid(), name: 'New sub-task', status: 'not-started', dueDate: '', notes: '', notesOpen: false });
        scheduleSave(); render();
      };
      tasksEl.appendChild(addTaskBtn);

      wrapper.appendChild(tasksEl);
    }

    return wrapper;
  }

  function renderCounterCard() {
    const c = state.counter;
    const pct = c.target > 0 ? Math.min(100, Math.round((c.current / c.target) * 100)) : 0;
    const wrapper = document.createElement('div');
    wrapper.className = 'counter-card';
    wrapper.innerHTML = `
      <div class="counter-head">
        <input class="counter-title-input" value="${escapeAttr(c.title)}" />
        <div class="counter-controls">
          <button class="counter-btn" data-act="dec">&minus;</button>
          <input class="counter-value" value="${c.current}" />
          <button class="counter-btn" data-act="inc">+</button>
          <div class="counter-target-row">
            / <input class="counter-target-input" value="${c.target}" />
          </div>
        </div>
      </div>
      <div class="counter-track"><div style="width:${pct}%"></div></div>
      <div class="counter-notes-row">
        <button class="icon-btn note-toggle ${c.notes ? 'has-note' : ''}" title="Notes">&#9998; Notes</button>
        ${c.notesOpen ? `<textarea class="counter-notes" placeholder="Write a note, or paste a link to an attachment...">${escapeHtml(c.notes || '')}</textarea>` : ''}
      </div>
    `;

    wrapper.querySelector('.counter-title-input').oninput = (e) => { c.title = e.target.value; scheduleSave(); };
    wrapper.querySelector('[data-act="dec"]').onclick = () => { c.current = Math.max(0, c.current - 1); scheduleSave(); render(); };
    wrapper.querySelector('[data-act="inc"]').onclick = () => { c.current = c.current + 1; scheduleSave(); render(); };
    wrapper.querySelector('.counter-value').onchange = (e) => {
      const v = parseInt(e.target.value, 10);
      c.current = isNaN(v) ? 0 : Math.max(0, v);
      scheduleSave(); render();
    };
    wrapper.querySelector('.counter-target-input').onchange = (e) => {
      const v = parseInt(e.target.value, 10);
      c.target = isNaN(v) || v < 1 ? 1 : v;
      scheduleSave(); render();
    };
    wrapper.querySelector('.note-toggle').onclick = () => { c.notesOpen = !c.notesOpen; scheduleSave(); render(); };
    const notesArea = wrapper.querySelector('.counter-notes');
    if (notesArea) { notesArea.oninput = (e) => { c.notes = e.target.value; scheduleSave(); }; }

    return wrapper;
  }

  function escapeAttr(str) {
    return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
  }
  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  async function init() {
    // 1. Try Supabase first (cross-device source of truth)
    try {
      const cloudState = await supabaseLoad();
      if (cloudState) {
        state = cloudState;
        if (!state.counter) state.counter = JSON.parse(JSON.stringify(defaultState.counter));
        render();
        return;
      }
    } catch (e) {
      console.error('Supabase load failed, falling back', e);
    }
    // 2. Try Claude.ai's window.storage
    try {
      if (window.storage) {
        const result = await window.storage.get(STORAGE_KEY, false);
        if (result) {
          state = JSON.parse(result.value);
          if (!state.counter) state.counter = JSON.parse(JSON.stringify(defaultState.counter));
          render();
          return;
        }
      }
    } catch (e) { /* fall through */ }
    // 3. Local storage or defaults
    state = loadLocalFallbackOrDefault();
    if (!state.counter) state.counter = JSON.parse(JSON.stringify(defaultState.counter));
    render();
  }

  function loadLocalFallbackOrDefault() {
    try {
      const local = localStorage.getItem(STORAGE_KEY);
      if (local) return JSON.parse(local);
    } catch (e) { /* ignore */ }
    return JSON.parse(JSON.stringify(defaultState));
  }

  init();
})();
</script>
